name: Sehgal Nightly White-Label Check

# 08-11-2026 (one road): this job CHECKS the live Sehgal Maruti web app and never writes it.
# The only writer of /app in this repository is the release from the source repository
# (software/W2 Portal/02 Sehgal Maruti App/tools/release/MarutiApp-Release.ps1), which also refreshes
# app-source as a read-only mirror. Before 08-11-2026 this job rebuilt /app from app-source at 22:30 IST
# and overwrote every release made during the day. It now has no write permission at all.

on:
  schedule:
    # 17:00 UTC = 10:30 PM IST every night
    - cron: '0 17 * * *'
  workflow_dispatch:

concurrency:
  group: sehgal-production-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-live-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (read only)
        uses: actions/checkout@v4

      - name: Step 1 - Repository /app carries no forbidden letters
        run: |
          echo "Scanning the published /app folder and 404.html in the repository..."
          if grep -riE "avni|tenant0|tenant1" app 404.html; then
            echo "::error::FATAL: forbidden brand or tenant string inside the published /app folder."
            exit 1
          fi
          echo "Repository /app verified clean."

      - name: Step 2 - Live site serves the same build and carries no forbidden letters
        run: |
          SITE="https://maruti.sehgalautoriders.com/app"
          mkdir -p live
          curl -fsSL -H 'Cache-Control: no-cache' "$SITE/index.html?check=$GITHUB_RUN_ID" -o live/index.html
          if [ -f app/build.txt ]; then
            curl -fsSL -H 'Cache-Control: no-cache' "$SITE/build.txt?check=$GITHUB_RUN_ID" -o live/build.txt || true
            echo "repository build mark: $(cat app/build.txt)"
            echo "live build mark:       $(cat live/build.txt 2>/dev/null || echo '(none yet - Pages may still be publishing)')"
          fi
          # every script and stylesheet the live page loads
          grep -oE '/app/assets/[^"]+' live/index.html | sort -u | while read -r a; do
            curl -fsSL "https://maruti.sehgalautoriders.com$a" -o "live/$(basename "$a")"
          done
          echo "downloaded $(ls live | wc -l) live files"
          if grep -riE "avni|tenant0|tenant1" live; then
            echo "::error::FATAL: forbidden brand or tenant string on the LIVE site."
            exit 1
          fi
          echo "Live site verified clean. Nothing was written by this job."
